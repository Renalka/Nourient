apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: test-fast-boot
  labels:
    cloud.googleapis.com/location: asia-southeast1
spec:
  template:
    spec:
      template:
        spec:
          containers:
          - image: asia-south1-docker.pkg.dev/nourient-508220/nourient/nourient-api:latest
            command:
            - /bin/bash
            - -c
            - "cat > /tmp/test.sh << 'SCRIPT'
export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
uvicorn services.extraction.main:app --host 127.0.0.1 --port 8000 >/dev/null 2>&1 &
uvicorn services.scoring.main:app --host 127.0.0.1 --port 8001 >/dev/null 2>&1 &
uvicorn services.auditor.main:app --host 127.0.0.1 --port 8002 >/dev/null 2>&1 &
uvicorn services.orchestrator.main:app --host 127.0.0.1 --port 8003 >/dev/null 2>&1 &
uvicorn services.detective.main:app --host 127.0.0.1 --port 8004 >/dev/null 2>&1 &
uvicorn services.biocontext.main:app --host 127.0.0.1 --port 8005 >/dev/null 2>&1 &
uvicorn services.alternatives.main:app --host 127.0.0.1 --port 8006 >/dev/null 2>&1 &
uvicorn services.basket.main:app --host 127.0.0.1 --port 8007 >/dev/null 2>&1 &
uvicorn services.nutrition.main:app --host 127.0.0.1 --port 8008 >/dev/null 2>&1 &
echo 'Waiting for all to bind...'
for port in {8000..8008}; do
  while ! curl -s http://127.0.0.1:\$port >/dev/null; do sleep 1; done
  echo \"Port \$port is up\"
done
echo 'All UP!'
SCRIPT
bash /tmp/test.sh"
            resources:
              limits:
                cpu: "4000m"
                memory: "8Gi"
