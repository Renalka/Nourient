apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: test-uvicorn-all
  labels:
    cloud.googleapis.com/location: asia-southeast1
spec:
  template:
    spec:
      template:
        spec:
          containers:
          - image: asia-south1-docker.pkg.dev/nourient-508220/nourient/nourient-api:latest
            command:
            - /bin/bash
            - -c
            - "export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1; uvicorn services.extraction.main:app --host 127.0.0.1 --port 8000 & uvicorn services.orchestrator.main:app --host 127.0.0.1 --port 8003 > /tmp/out.log 2>&1 & sleep 10 ; cat /tmp/out.log"
            resources:
              limits:
                cpu: "4000m"
                memory: "8Gi"
